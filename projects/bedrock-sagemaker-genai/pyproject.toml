[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bedrock-sagemaker-genai"
version = "1.0.0"
description = "Provider-neutral Generative AI inference control plane for Amazon Bedrock and SageMaker AI"
requires-python = ">=3.11"
dependencies = ["boto3>=1.35,<2", "fastapi>=0.115,<1", "pydantic-settings>=2.6,<3", "uvicorn[standard]>=0.32,<1"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8.3,<9", "ruff>=0.8,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

